name: External collector watchdog

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: public-collector-external-watchdog
  cancel-in-progress: true

jobs:
  route:
    if: github.repository == 'janwohlers78/mardorf-data-collector'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      PRIVATE_REPO: janwohlers78/mardorf-kitevorhersage
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Check SVG freshness
        id: svg
        run: PYTHONPATH=src python3 -m mardorf_collector check-collection-due --kind svg --max-age-minutes 40

      - name: Check model freshness
        id: models
        run: PYTHONPATH=src python3 -m mardorf_collector check-collection-due --kind models --max-age-minutes 150

      - name: Check secondary freshness
        id: secondary
        run: PYTHONPATH=src python3 -m mardorf_collector check-collection-due --kind secondary --max-age-minutes 240

      - name: Check integrated daily report recovery slot
        id: daily_weather
        run: PYTHONPATH=src python3 -m mardorf_collector check-collection-due --kind daily_weather --max-age-minutes 0

      - name: Check current forecast source refresh
        id: current_weather
        run: PYTHONPATH=src python3 -m mardorf_collector check-collection-due --kind current_weather --max-age-minutes 180

      - name: Check experimental thunder warning slot
        id: thunder_warning
        run: PYTHONPATH=src python3 -m mardorf_collector.runtime.thunder_warning_due_v1 --recovery

      - name: Dispatch only due idle collectors
        shell: bash
        run: |
          set -euo pipefail

          dispatch_if_due() {
            local workflow="$1"
            local due="$2"
            local reason="$3"
            local age="$4"
            local threshold="$5"
            local mode="${6:-watchdog}"

            if [ "$due" != "true" ]; then
              echo "$workflow: no dispatch (age=$age min threshold=$threshold min reason=$reason)"
              return 0
            fi

            local busy
            busy="$(gh run list --workflow "$workflow" --limit 20 --json status --jq '[.[] | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending" or .status=="requested")] | length')"
            if [ "$busy" != "0" ]; then
              echo "$workflow: due but already queued/running; skip duplicate dispatch"
              return 0
            fi

            echo "$workflow: due; dispatching $mode=true (age=$age min threshold=$threshold min reason=$reason)"
            if [ "$mode" = "li_warning" ]; then
              gh workflow run "$workflow" --repo "$GH_REPO" --ref main -f li_warning=true
            else
              gh workflow run "$workflow" --repo "$GH_REPO" --ref main -f watchdog=true
            fi
          }

          dispatch_if_due             collect-svg.yml             "${{ steps.svg.outputs.due }}"             "${{ steps.svg.outputs.reason }}"             "${{ steps.svg.outputs.age_minutes }}"             "${{ steps.svg.outputs.threshold_minutes }}"

          dispatch_if_due             collect-models.yml             "${{ steps.models.outputs.due }}"             "${{ steps.models.outputs.reason }}"             "${{ steps.models.outputs.age_minutes }}"             "${{ steps.models.outputs.threshold_minutes }}"

          dispatch_if_due             collect-secondary.yml             "${{ steps.secondary.outputs.due }}"             "${{ steps.secondary.outputs.reason }}"             "${{ steps.secondary.outputs.age_minutes }}"             "${{ steps.secondary.outputs.threshold_minutes }}"

          dispatch_if_due wp06-single-run-daily.yml "${{ steps.thunder_warning.outputs.due }}" "${{ steps.thunder_warning.outputs.reason }}" "${{ steps.thunder_warning.outputs.age_minutes }}" "${{ steps.thunder_warning.outputs.threshold_minutes }}" li_warning

          if [ "${{ steps.daily_weather.outputs.due }}" = "true" ]; then
          dispatch_if_due             wp06-single-run-daily.yml             "${{ steps.daily_weather.outputs.due }}"             "${{ steps.daily_weather.outputs.reason }}"             "${{ steps.daily_weather.outputs.age_minutes }}"             "${{ steps.daily_weather.outputs.threshold_minutes }}"

          else
            dispatch_if_due wp06-single-run-daily.yml "${{ steps.current_weather.outputs.due }}" "${{ steps.current_weather.outputs.reason }}" "${{ steps.current_weather.outputs.age_minutes }}" "${{ steps.current_weather.outputs.threshold_minutes }}"
          fi

      - name: Publish watchdog decision summary
        if: always()
        run: |
          {
            echo "## External collector watchdog"
            echo
            echo "| Collector | Due | Age min | Threshold min | Reason |"
            echo "|---|---:|---:|---:|---|"
            echo "| SVG | ${{ steps.svg.outputs.due }} | ${{ steps.svg.outputs.age_minutes }} | ${{ steps.svg.outputs.threshold_minutes }} | ${{ steps.svg.outputs.reason }} |"
            echo "| Models | ${{ steps.models.outputs.due }} | ${{ steps.models.outputs.age_minutes }} | ${{ steps.models.outputs.threshold_minutes }} | ${{ steps.models.outputs.reason }} |"
            echo "| Secondary | ${{ steps.secondary.outputs.due }} | ${{ steps.secondary.outputs.age_minutes }} | ${{ steps.secondary.outputs.threshold_minutes }} | ${{ steps.secondary.outputs.reason }} |"
            echo
            echo "Only due collectors are dispatched, and an already queued/running collector is never duplicated."
          } >> "$GITHUB_STEP_SUMMARY"
