name: Phase 2F-4 one-shot full model dispatcher

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase2f4-dispatch-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.repository == 'janwohlers78/mardorf-data-collector'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch full model validation on current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/janwohlers78/mardorf-data-collector/actions/workflows/collect-models.yml/dispatches"             -d '{"ref":"main","inputs":{"test_mode":"false","full_validation":"true","watchdog":"false"}}'
