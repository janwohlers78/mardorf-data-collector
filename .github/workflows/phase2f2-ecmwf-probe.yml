name: Phase 2F-2 ECMWF live product probe

on:
  push:
    branches:
      - phase2f2-ecmwf-expansion
    paths:
      - '.github/workflows/phase2f2-ecmwf-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install ecCodes
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-tools
          grib_ls -V
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-runtime.txt
      - name: Probe current IFS Open Data Registry-v1 candidates
        env:
          PYTHONPATH: src
          ECMWF_OPEN_DATA_SOURCE: azure
        run: |
          python - <<'PY'
          import json
          import subprocess
          import tempfile
          from pathlib import Path

          from ecmwf.opendata import Client
          import provider_cycle_gate as gate

          source="azure"
          client=Client(source=source,model="ifs",resol="0p25",maximum_retries=2,retry_after=5)
          with tempfile.TemporaryDirectory() as td:
              root=Path(td)
              run=gate._ecmwf_cycle(full_validation=False)
              candidates=[
                  "10u","10v","10fg","10fg3","tp","mucape",
                  "2t","2d","sp","msl","tcc","ssrd",
                  "2r","r","cin","mucin",
              ]
              out={
                  "schema_version":1,
                  "method_version":"phase2f2-ecmwf-live-product-probe-v1",
                  "source":source,
                  "selected_run_time_utc":run.isoformat(),
                  "step_hours":12,
                  "candidates":{},
              }
              for param in candidates:
                  target=root/f"{param}.grib2"
                  try:
                      client.retrieve(
                          date=run.strftime("%Y%m%d"),
                          time=run.hour,
                          stream="oper",
                          type="fc",
                          step=[12],
                          param=[param],
                          target=str(target),
                      )
                      if not target.exists() or target.stat().st_size == 0:
                          raise RuntimeError("retrieve returned no GRIB bytes")
                      meta=subprocess.run(
                          [
                              "grib_ls","-p",
                              "shortName,name,paramId,typeOfLevel,level,stepType,stepRange,startStep,endStep,units,dataDate,dataTime,validityDate,validityTime",
                              str(target),
                          ],
                          capture_output=True,text=True,check=True,
                      ).stdout
                      out["candidates"][param]={
                          "status":"received",
                          "bytes":target.stat().st_size,
                          "grib_ls":meta,
                      }
                  except Exception as exc:
                      out["candidates"][param]={
                          "status":"unsupported_or_unavailable",
                          "exception_type":type(exc).__name__,
                          "exception_message":str(exc)[:800],
                      }
              print(json.dumps(out,indent=2,sort_keys=True))
          PY
