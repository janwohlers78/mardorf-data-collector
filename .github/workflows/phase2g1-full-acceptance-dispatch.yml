name: Phase 2G-1 provider-cycle live diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase2g1-full-acceptance-dispatch.yml'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      PRIVATE_REPO: janwohlers78/mardorf-kitevorhersage
      FULL_VALIDATION: 'true'
      COLLECTOR_MODEL_FILE: work/model_snapshot.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install ecCodes
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-tools
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-runtime.txt
      - name: Run provider-cycle gate against live private evidence
        id: gate
        run: python src/provider_cycle_gate.py --plan-out /tmp/phase2g1-provider-cycle.json
      - name: Verify all current provider cycles are carry-forward
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/phase2g1-provider-cycle.json'))
          assert p['method_version']=='provider-cycle-gate-v2-gefs-full',p
          bad={m:x for m,x in p['models'].items() if x.get('action')!='carry_forward'}
          assert not bad,bad
          full=p['full_ensembles']['NOAA_GEFS']
          assert full.get('action')=='carry_forward',full
          assert p['any_work'] is False,p
          assert p['delta_prediction']=='zero',p
          assert p['no_op_transfer_suppressed'] is True,p
          print('PHASE2G1_PROVIDER_CYCLE_GATE='+json.dumps({
            'status':'PASS',
            'checked_at_utc':p['checked_at_utc'],
            'models':{m:{'action':x['action'],'run':x.get('selected_run_time_utc'),'evidence':x.get('archive_cycle_evidence_present')} for m,x in p['models'].items()},
            'NOAA_GEFS':{'action':full['action'],'run':full.get('selected_run_time_utc'),'evidence':full.get('archive_cycle_evidence_present')},
            'any_work':p['any_work'],
            'no_op_transfer_suppressed':p['no_op_transfer_suppressed'],
          },sort_keys=True))
          PY
