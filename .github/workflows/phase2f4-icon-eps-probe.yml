name: Phase 2F-4 ICON-D2-EPS member weather probe

on:
  push:
    branches:
      - phase2f4-icon-d2-eps-weather-activation
    paths:
      - '.github/workflows/phase2f4-icon-eps-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    if: github.repository == 'janwohlers78/mardorf-data-collector'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe stable 20-member weather response
        shell: bash
        run: |
          python3 - <<'PY'
          import json, math, re, ssl, time
          import urllib.parse, urllib.request, urllib.error
          from datetime import datetime, timezone, timedelta

          META='https://api.open-meteo.com/data/dwd_icon_d2_eps/static/meta.json'
          API='https://ensemble-api.open-meteo.com/v1/ensemble'
          LAT=52.4942; LON=9.3418
          EXISTING=['wind_speed_10m','wind_direction_10m','wind_gusts_10m','precipitation','cape']
          CANDIDATES=[
              'temperature_2m','relative_humidity_2m','dew_point_2m',
              'pressure_msl','surface_pressure','cloud_cover',
              'shortwave_radiation','cin'
          ]

          def get_json(url, timeout=120):
              last=None
              for attempt in range(5):
                  req=urllib.request.Request(
                      url,headers={'User-Agent':'mardorf-data-collector/phase2f4-probe'}
                  )
                  try:
                      with urllib.request.urlopen(req,timeout=timeout) as r:
                          return json.load(r),r.status,r.geturl(),None
                  except urllib.error.HTTPError as e:
                      body=e.read().decode('utf-8','replace')[:1000]
                      if e.code not in (408,429,500,502,503,504):
                          return None,e.code,e.geturl(),body
                      last=f'HTTP {e.code}: {body}'
                  except (urllib.error.URLError,TimeoutError,ssl.SSLError) as e:
                      last=repr(e)
                  if attempt < 4:
                      time.sleep(2**attempt)
              raise RuntimeError(f'GET retries exhausted for {url}: {last}')

          def query(fields):
              q={
                  'latitude':LAT,'longitude':LON,'hourly':','.join(fields),
                  'models':'dwd_icon_d2_eps','past_days':1,'forecast_days':4,
                  'wind_speed_unit':'ms','timezone':'GMT'
              }
              return get_json(API+'?'+urllib.parse.urlencode(q))

          before,_,_,_=get_json(META,45)
          run=datetime.fromtimestamp(int(before['last_run_initialisation_time']),tz=timezone.utc)
          availability=datetime.fromtimestamp(int(before['last_run_availability_time']),tz=timezone.utc)
          age=(datetime.now(timezone.utc)-availability).total_seconds()
          if age < 600:
              raise SystemExit(f'run not settled: availability age {age:.1f}s < 600s')

          capability={};accepted=set();rejected=set()
          def classify(group):
              if not group:return
              payload,status,_,err=query(EXISTING+list(group))
              if payload is not None:
                  for field in group:
                      capability[field]={'http_status':status,'accepted':True,'error':None}
                      accepted.add(field)
                  return
              if len(group)==1:
                  field=group[0]
                  capability[field]={'http_status':status,'accepted':False,'error':err}
                  rejected.add(field)
                  return
              middle=len(group)//2
              classify(group[:middle]);classify(group[middle:])

          classify(CANDIDATES)
          fields=EXISTING+[x for x in CANDIDATES if x in accepted]
          payload,status,url,err=query(fields)
          if payload is None:
              raise SystemExit(f'final combined request failed HTTP {status}: {err}')

          after,_,_,_=get_json(META,45)
          stable=all(
              before.get(k)==after.get(k)
              for k in ('last_run_initialisation_time','last_run_availability_time','last_run_modification_time')
          )
          if not stable:
              raise SystemExit('provider metadata changed across capability/final ensemble responses')

          hourly=payload.get('hourly') or {}
          times=hourly.get('time') or []
          def norm_time(value):
              parsed=datetime.fromisoformat(str(value).replace('Z','+00:00'))
              if parsed.tzinfo is None:parsed=parsed.replace(tzinfo=timezone.utc)
              return parsed.astimezone(timezone.utc).isoformat()
          index={norm_time(t):i for i,t in enumerate(times)}
          required=[(run+timedelta(hours=h)).isoformat() for h in range(49)]
          missing=[t for t in required if t not in index]
          if missing:
              raise SystemExit('required 0-48h axis missing: '+repr(missing[:5]))

          def columns(prefix):
              out={}
              if prefix in hourly:out[0]=hourly[prefix]
              for key,values in hourly.items():
                  match=re.fullmatch(re.escape(prefix)+r'_member(\d+)',key)
                  if match:out[int(match.group(1))]=values
              return out

          report={
              'run_time_utc':run.isoformat(),
              'availability_age_seconds':round(age,1),
              'metadata_stable':stable,
              'capability':capability,
              'accepted_candidates':[x for x in CANDIDATES if x in accepted],
              'rejected_candidates':[x for x in CANDIDATES if x in rejected],
              'final_request_fields':fields,
              'returned_coordinate':{'latitude':payload.get('latitude'),'longitude':payload.get('longitude')},
              'response_http_status':status,
              'fields':{}
          }
          units=payload.get('hourly_units') or {}
          for field in fields:
              cols=columns(field);failures={};complete=[]
              for member in range(20):
                  values=cols.get(member)
                  if values is None:
                      failures[str(member)]='column_missing';continue
                  bad=0
                  for valid in required:
                      pos=index[valid]
                      value=values[pos] if pos<len(values) else None
                      if not isinstance(value,(int,float)) or isinstance(value,bool) or not math.isfinite(float(value)):
                          bad+=1
                  if bad:failures[str(member)]=f'nonfinite_or_missing:{bad}'
                  else:complete.append(member)
              report['fields'][field]={
                  'member_ids':sorted(cols),
                  'member_count':len(cols),
                  'complete_0_48_member_ids':complete,
                  'complete_0_48_member_count':len(complete),
                  'member_failures':failures,
                  'unit':units.get(field),
                  'same_final_response':True
              }

          print('PHASE2F4_PROBE='+json.dumps(report,sort_keys=True,separators=(',',':')))
          print('\nCapability:')
          for field in CANDIDATES:
              d=capability[field]
              print(f"{field}: HTTP={d['http_status']} accepted={d['accepted']} error={d['error']}")
          print('\nFinal combined response:')
          for field,d in report['fields'].items():
              print(f"{field}: columns={d['member_count']} complete_0_48={d['complete_0_48_member_count']} unit={d['unit']} failures={d['member_failures']}")
          PY
