name: Phase 2F-4 ICON-D2-EPS member weather probe

on:
  push:
    branches:
      - phase2f4-icon-d2-eps-weather-activation
    paths:
      - '.github/workflows/phase2f4-icon-eps-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    if: github.repository == 'janwohlers78/mardorf-data-collector'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-runtime.txt
      - name: Probe stable 20-member weather response
        shell: bash
        run: |
          python3 - <<'PY'
          import json, math, re
          from datetime import datetime, timezone, timedelta
          import requests
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          META='https://api.open-meteo.com/data/dwd_icon_d2_eps/static/meta.json'
          API='https://ensemble-api.open-meteo.com/v1/ensemble'
          LAT=52.4942; LON=9.3418
          EXISTING=['wind_speed_10m','wind_direction_10m','wind_gusts_10m','precipitation','cape']
          CANDIDATES=[
              'temperature_2m','relative_humidity_2m','dew_point_2m',
              'pressure_msl','surface_pressure','cloud_cover',
              'shortwave_radiation','cin'
          ]

          S=requests.Session()
          S.headers.update({'User-Agent':'mardorf-data-collector/phase2f4-probe'})
          retry=Retry(total=4,connect=4,read=4,status=4,backoff_factor=1.0,
                      status_forcelist=(408,429,500,502,503,504),
                      allowed_methods=frozenset(['GET']),raise_on_status=False,
                      respect_retry_after_header=True)
          S.mount('https://',HTTPAdapter(max_retries=retry,pool_connections=2,pool_maxsize=2))

          def metadata():
              r=S.get(META,timeout=45)
              r.raise_for_status()
              return r.json()

          def query(fields):
              q={
                  'latitude':LAT,'longitude':LON,'hourly':','.join(fields),
                  'models':'dwd_icon_d2_eps','past_days':1,'forecast_days':4,
                  'wind_speed_unit':'ms','timezone':'GMT'
              }
              r=S.get(API,params=q,timeout=120)
              if r.status_code >= 400:
                  return None,r.status_code,r.text[:1000]
              return r.json(),r.status_code,None

          before=metadata()
          init=int(before['last_run_initialisation_time'])
          avail=int(before['last_run_availability_time'])
          run=datetime.fromtimestamp(init,tz=timezone.utc)
          age=(datetime.now(timezone.utc)-datetime.fromtimestamp(avail,tz=timezone.utc)).total_seconds()
          if age < 600:
              raise SystemExit(f'run not settled: availability age {age:.1f}s < 600s')

          capability={}
          accepted=[]
          rejected=[]

          def classify(group):
              if not group:
                  return
              payload,status,err=query(EXISTING+group)
              if payload is not None:
                  for field in group:
                      capability[field]={'http_status':status,'accepted':True,'error':None}
                      accepted.append(field)
                  return
              if len(group)==1:
                  field=group[0]
                  capability[field]={'http_status':status,'accepted':False,'error':err}
                  rejected.append(field)
                  return
              mid=len(group)//2
              classify(group[:mid])
              classify(group[mid:])

          classify(CANDIDATES)
          fields=EXISTING+[x for x in CANDIDATES if x in accepted]
          payload,status,err=query(fields)
          if payload is None:
              raise SystemExit(f'final combined request failed HTTP {status}: {err}')

          after=metadata()
          stable=(
              before.get('last_run_initialisation_time')==after.get('last_run_initialisation_time')
              and before.get('last_run_availability_time')==after.get('last_run_availability_time')
              and before.get('last_run_modification_time')==after.get('last_run_modification_time')
          )
          if not stable:
              raise SystemExit('provider metadata changed across capability/final ensemble responses')

          hourly=payload.get('hourly') or {}
          times=hourly.get('time') or []
          def norm_time(x):
              d=datetime.fromisoformat(str(x).replace('Z','+00:00'))
              if d.tzinfo is None:
                  d=d.replace(tzinfo=timezone.utc)
              return d.astimezone(timezone.utc).isoformat()
          index={norm_time(t):i for i,t in enumerate(times)}
          required=[(run+timedelta(hours=h)).isoformat() for h in range(49)]

          def columns(prefix):
              out={}
              if prefix in hourly:
                  out[0]=hourly[prefix]
              for key,vals in hourly.items():
                  m=re.fullmatch(re.escape(prefix)+r'_member(\d+)',key)
                  if m:
                      out[int(m.group(1))]=vals
              return out

          missing=[t for t in required if t not in index]
          if missing:
              raise SystemExit('required 0-48h axis missing: '+repr(missing[:5]))

          report={
              'run_time_utc':run.isoformat(),
              'availability_age_seconds':round(age,1),
              'metadata_stable':stable,
              'capability':capability,
              'accepted_candidates':[x for x in CANDIDATES if x in accepted],
              'rejected_candidates':[x for x in CANDIDATES if x in rejected],
              'final_request_fields':fields,
              'returned_coordinate':{'latitude':payload.get('latitude'),'longitude':payload.get('longitude')},
              'response_http_status':status,
              'hourly_units':payload.get('hourly_units') or {},
              'fields':{}
          }

          for field in fields:
              cols=columns(field)
              member_ids=sorted(cols)
              finite_members=[]
              member_failures={}
              for m in range(20):
                  vals=cols.get(m)
                  if vals is None:
                      member_failures[str(m)]='column_missing'
                      continue
                  bad=[]
                  for t in required:
                      i=index[t]
                      v=vals[i] if i < len(vals) else None
                      if not isinstance(v,(int,float)) or isinstance(v,bool) or not math.isfinite(float(v)):
                          bad.append(t)
                  if bad:
                      member_failures[str(m)]=f'nonfinite_or_missing:{len(bad)}'
                  else:
                      finite_members.append(m)
              report['fields'][field]={
                  'member_ids':member_ids,
                  'member_count':len(member_ids),
                  'complete_0_48_member_ids':finite_members,
                  'complete_0_48_member_count':len(finite_members),
                  'member_failures':member_failures,
                  'unit':(payload.get('hourly_units') or {}).get(field),
                  'same_final_response':True,
              }

          print('PHASE2F4_PROBE='+json.dumps(report,sort_keys=True,separators=(',',':')))
          print('\nCapability:')
          for f in CANDIDATES:
              d=capability[f]
              print(f"{f}: HTTP={d['http_status']} accepted={d['accepted']} error={d['error']}")
          print('\nFinal combined response:')
          for f,d in report['fields'].items():
              print(f"{f}: columns={d['member_count']} complete_0_48={d['complete_0_48_member_count']} unit={d['unit']} failures={d['member_failures']}")

          with open('/tmp/phase2f4_probe.json','w') as fh:
              json.dump(report,fh,sort_keys=True,indent=2)
          PY
          {
            echo '## Phase 2F-4 ICON-D2-EPS live member-field probe'
            echo
            echo '```json'
            cat /tmp/phase2f4_probe.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
