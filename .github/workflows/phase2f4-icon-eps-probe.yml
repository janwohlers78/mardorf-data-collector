name: Phase 2F-4 ICON-D2-EPS member weather probe

on:
  push:
    branches:
      - phase2f4-icon-d2-eps-weather-activation
    paths:
      - '.github/workflows/phase2f4-icon-eps-probe.yml'
      - 'src/phase2f4_icon_eps_probe.py'

permissions:
  contents: read

jobs:
  probe:
    if: github.repository == 'janwohlers78/mardorf-data-collector'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-runtime.txt
      - name: Probe stable 20-member weather response
        run: python src/phase2f4_icon_eps_probe.py
      - name: Publish probe summary
        if: success()
        run: |
          {
            echo '## Phase 2F-4 ICON-D2-EPS live member-field probe'
            echo
            echo '```json'
            cat /tmp/phase2f4_probe.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
