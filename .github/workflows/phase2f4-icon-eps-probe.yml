name: Phase 2F-4 ICON-D2-EPS member weather probe

on:
  push:
    branches:
      - phase2f4-icon-d2-eps-weather-activation
    paths:
      - '.github/workflows/phase2f4-icon-eps-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    if: github.repository == 'janwohlers78/mardorf-data-collector'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe one stable 20-member response
        shell: bash
        run: |
          python3 - <<'PY'
          import json, math, re, urllib.parse, urllib.request
          from datetime import datetime, timezone, timedelta

          META='https://api.open-meteo.com/data/dwd_icon_d2_eps/static/meta.json'
          API='https://ensemble-api.open-meteo.com/v1/ensemble'
          LAT=52.4942; LON=9.3418
          EXISTING=['wind_speed_10m','wind_direction_10m','wind_gusts_10m','precipitation','cape']
          CANDIDATES=[
              'temperature_2m','relative_humidity_2m','dew_point_2m',
              'pressure_msl','surface_pressure','cloud_cover',
              'shortwave_radiation','cin'
          ]
          FIELDS=EXISTING+CANDIDATES

          def get_json(url):
              req=urllib.request.Request(url,headers={'User-Agent':'mardorf-data-collector/phase2f4-probe'})
              with urllib.request.urlopen(req,timeout=90) as r:
                  return json.load(r), r.status, r.geturl()

          before,_,_=get_json(META)
          init=int(before['last_run_initialisation_time'])
          avail=int(before['last_run_availability_time'])
          run=datetime.fromtimestamp(init,tz=timezone.utc)
          age=(datetime.now(timezone.utc)-datetime.fromtimestamp(avail,tz=timezone.utc)).total_seconds()
          if age < 600:
              raise SystemExit(f'run not settled: availability age {age:.1f}s < 600s')

          q={
              'latitude':LAT,'longitude':LON,'hourly':','.join(FIELDS),
              'models':'dwd_icon_d2_eps','past_days':1,'forecast_days':4,
              'wind_speed_unit':'ms','timezone':'GMT'
          }
          payload,status,url=get_json(API+'?'+urllib.parse.urlencode(q))
          after,_,_=get_json(META)
          stable=(
              before.get('last_run_initialisation_time')==after.get('last_run_initialisation_time')
              and before.get('last_run_availability_time')==after.get('last_run_availability_time')
          )
          if not stable:
              raise SystemExit('provider metadata changed across ensemble response')

          hourly=payload.get('hourly') or {}
          times=hourly.get('time') or []
          index={str(t).replace('Z','+00:00'):i for i,t in enumerate(times)}
          required=[(run+timedelta(hours=h)).isoformat() for h in range(49)]

          def columns(prefix):
              out={}
              if prefix in hourly:
                  out[0]=hourly[prefix]
              for key,vals in hourly.items():
                  m=re.fullmatch(re.escape(prefix)+r'_member(\d+)',key)
                  if m:
                      out[int(m.group(1))]=vals
              return out

          report={
              'run_time_utc':run.isoformat(),
              'metadata_stable':stable,
              'returned_coordinate':{'latitude':payload.get('latitude'),'longitude':payload.get('longitude')},
              'response_http_status':status,
              'hourly_units':payload.get('hourly_units') or {},
              'fields':{}
          }
          all_required_times=all(t in index for t in required)
          if not all_required_times:
              missing=[t for t in required if t not in index]
              raise SystemExit('required 0-48h axis missing: '+repr(missing[:5]))

          for field in FIELDS:
              cols=columns(field)
              member_ids=sorted(cols)
              finite_members=[]
              member_failures={}
              for m in range(20):
                  vals=cols.get(m)
                  if vals is None:
                      member_failures[str(m)]='column_missing'
                      continue
                  bad=[]
                  for t in required:
                      i=index[t]
                      v=vals[i] if i < len(vals) else None
                      if not isinstance(v,(int,float)) or isinstance(v,bool) or not math.isfinite(float(v)):
                          bad.append(t)
                  if bad:
                      member_failures[str(m)]=f'nonfinite_or_missing:{len(bad)}'
                  else:
                      finite_members.append(m)
              report['fields'][field]={
                  'member_ids':member_ids,
                  'member_count':len(member_ids),
                  'complete_0_48_member_ids':finite_members,
                  'complete_0_48_member_count':len(finite_members),
                  'member_failures':member_failures,
                  'unit':(payload.get('hourly_units') or {}).get(field),
                  'same_response':True,
              }

          print('PHASE2F4_PROBE='+json.dumps(report,sort_keys=True,separators=(',',':')))
          print('\nSummary:')
          for f,d in report['fields'].items():
              print(f"{f}: columns={d['member_count']} complete_0_48={d['complete_0_48_member_count']} unit={d['unit']} failures={d['member_failures']}")

          with open('/tmp/phase2f4_probe.json','w') as fh:
              json.dump(report,fh,sort_keys=True,indent=2)
          PY
          {
            echo '## Phase 2F-4 ICON-D2-EPS live member-field probe'
            echo
            echo '```json'
            cat /tmp/phase2f4_probe.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
