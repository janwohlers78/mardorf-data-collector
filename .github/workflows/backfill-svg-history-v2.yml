name: Acquire historical SVG source receipts

on:
  workflow_dispatch:
    inputs:
      start:
        description: First UTC day inclusive
        required: true
        type: string
      end_exclusive:
        description: Last UTC day exclusive
        required: true
        type: string
      research_only:
        description: Immutable B2 research only, no production head or Git weather writes
        type: boolean
        default: true
      probe_days:
        description: Optional comma-separated1–12 dated UTC probes instead of the range
        type: string
        default: ''

permissions:
  contents: read
concurrency:
  group: svg-historical-acquisition-v2
  cancel-in-progress: false
jobs:
  acquire:
    if: github.repository == 'janwohlers78/mardorf-data-collector'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: inputs.research_only != true
        with:
          repository: janwohlers78/mardorf-kitevorhersage
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-cache
          persist-credentials: false
          sparse-checkout: data/observations/svg_weatherlink/history_v2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned provider client
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-runtime.txt -r requirements-cloud.txt
      - name: Retrieve missing days and transfer exact immutable bytes
        if: inputs.research_only != true
        env:
          WEATHERLINK_API_KEY: ${{ secrets.WEATHERLINK_API_KEY }}
          WEATHERLINK_API_SECRET: ${{ secrets.WEATHERLINK_API_SECRET }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          PRIVATE_REPO: janwohlers78/mardorf-kitevorhersage
          START_DAY: ${{ inputs.start }}
          END_DAY: ${{ inputs.end_exclusive }}
        run: PYTHONPATH=src python -m mardorf_collector.providers.svg_history_v2 --start "$START_DAY" --end-exclusive "$END_DAY" --private-cache private-cache
      - name: Retrieve bounded historical source evidence to B2 research namespace
        if: inputs.research_only == true
        env:
          WEATHERLINK_API_KEY: ${{ secrets.WEATHERLINK_API_KEY }}
          WEATHERLINK_API_SECRET: ${{ secrets.WEATHERLINK_API_SECRET }}
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_ENDPOINT_URL: ${{ vars.B2_ENDPOINT_URL }}
          B2_REGION: ${{ vars.B2_REGION }}
          B2_BUCKET: ${{ vars.B2_BUCKET }}
          START_DAY: ${{ inputs.start }}
          END_DAY: ${{ inputs.end_exclusive }}
          PROBE_DAYS: ${{ inputs.probe_days }}
        run: PYTHONPATH=src python -m mardorf_collector.providers.svg_historical_research_v1 --start "$START_DAY" --end-exclusive "$END_DAY" --probe-days "$PROBE_DAYS"
