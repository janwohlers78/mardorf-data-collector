name: Phase 2F-3 full GEFS live proof

on:
  push:
    branches: [phase2f3-full-liveproof]
    paths:
      - '.github/workflows/phase2f3-full-gefs-liveproof.yml'

permissions:
  contents: read

concurrency:
  group: phase2f3-full-gefs-liveproof
  cancel-in-progress: true

jobs:
  liveproof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COLLECTOR_MODEL_FILE: work/model_snapshot.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install ecCodes
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-tools
          grib_ls -V

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install production dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-runtime.txt

      - name: Seed latest verified private model bundle
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,json,os,urllib.request
          from pathlib import Path
          token=os.environ['PRIVATE_REPO_TOKEN']
          repo='janwohlers78/mardorf-kitevorhersage'
          api='https://api.github.com'
          def contents(path):
              req=urllib.request.Request(
                  f'{api}/repos/{repo}/contents/{path}?ref=main',
                  headers={
                      'Authorization':f'Bearer {token}',
                      'Accept':'application/vnd.github+json',
                      'X-GitHub-Api-Version':'2022-11-28',
                      'User-Agent':'mardorf-phase2f3-full-liveproof/1.0',
                  })
              with urllib.request.urlopen(req,timeout=30) as r:
                  meta=json.loads(r.read().decode())
              raw=meta.get('content')
              if not raw:
                  raise RuntimeError(f'No inline content for {path}')
              return base64.b64decode(raw.replace('\n',''))
          latest=json.loads(contents('data/inbox/public_collector/integrity/models/latest_success.json'))
          private=latest['private_payload']
          packed=contents(private['destination'])
          raw=gzip.decompress(packed)
          actual=hashlib.sha256(raw).hexdigest()
          if actual!=private['source_sha256']:
              raise RuntimeError(f"seed SHA mismatch {actual} != {private['source_sha256']}")
          data=json.loads(raw)
          Path('work').mkdir(exist_ok=True)
          Path('work/model_snapshot.json').write_text(json.dumps(data,separators=(',',':'))+'\n')
          print(json.dumps({
              'seed_generated_at_utc':latest.get('generated_at_utc'),
              'seed_payload':private['destination'],
              'seed_sha256':actual,
              'seed_integrity_status':latest.get('status'),
              'seed_error_count':latest.get('error_count'),
          },indent=2))
          PY

      - name: Fetch complete sparse 31-member GEFS 00Z source
        run: |
          timeout --signal=TERM --kill-after=15s 10m \
            python src/gefs_full_members.py --workers 4 --force

      - name: Finalize availability contract
        run: python src/availability_contract.py --input work/model_snapshot.json

      - name: Audit complete liveproof bundle
        run: |
          python src/audit_integrity.py \
            --kind models \
            --input work/model_snapshot.json \
            --json-out work/model_integrity.json \
            --md-out work/model_integrity.md
          cat work/model_integrity.md >> "$GITHUB_STEP_SUMMARY"

      - name: Assert GEFS full-member acceptance gates
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json,os
          d=json.load(open('work/model_snapshot.json'))
          a=json.load(open('work/model_integrity.json'))
          s=d['gefs_full_member_source']
          metrics=s.get('traffic_metrics') or s.get('request_metrics') or {}
          total_requests=int(metrics.get('total_requests',metrics.get('requests',0)))
          response_bytes=int(metrics.get('total_response_bytes',metrics.get('response_bytes',0)))
          wall=float(s.get('collection_wall_seconds',0))
          assert s['collection_status']=='complete',s['collection_status']
          assert s['expected_request_count']==744,s['expected_request_count']
          assert s['received_request_count']==744,s['received_request_count']
          assert len(s['expected_member_ids'])==31,len(s['expected_member_ids'])
          assert total_requests<=800,total_requests
          assert response_bytes<=2*1024*1024,response_bytes
          assert wall<=600,wall
          assert a['error_count']==0,a
          summary={
              'run_time_utc':s['run_time_utc'],
              'members':len(s['expected_member_ids']),
              'leads':len(s['leads_hours']),
              'member_requests':s['received_request_count'],
              'total_requests_including_qa':total_requests,
              'response_bytes':response_bytes,
              'collection_wall_seconds':wall,
              'provider_summary_qa_status':(s.get('provider_summary_qa') or {}).get('status'),
              'integrity_status':a['status'],
              'integrity_errors':a['error_count'],
              'integrity_warnings':a['warning_count'],
          }
          print(json.dumps(summary,indent=2,sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as fh:
              fh.write('\n## Phase 2F-3 full GEFS live proof\n\n'+json.dumps(summary,indent=2,sort_keys=True)+'\n')
          PY

      - name: Transfer accepted liveproof bundle to private repository
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          PRIVATE_REPO: janwohlers78/mardorf-kitevorhersage
        run: |
          python src/push_private.py \
            --kind models \
            --file work/model_snapshot.json \
            --integrity-json work/model_integrity.json \
            --integrity-md work/model_integrity.md

      - name: Fail if integrity audit is not green
        run: |
          python - <<'PY'
          import json
          d=json.load(open('work/model_integrity.json'))
          if d['error_count']:
              raise SystemExit(1)
          PY
