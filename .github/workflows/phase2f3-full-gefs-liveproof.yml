name: Phase 2F-3 full GEFS live proof

on:
  push:
    branches:
      - phase2f3-full-liveproof
    paths:
      - '.github/workflows/phase2f3-full-gefs-liveproof.yml'

permissions:
  contents: read

jobs:
  liveproof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COLLECTOR_MODEL_FILE: work/model_snapshot.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install ecCodes
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-tools

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install production dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-runtime.txt

      - name: Seed latest verified private model bundle
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: python src/phase2f3_liveproof_helper.py seed

      - name: Fetch complete sparse 31-member GEFS 00Z source
        run: |
          timeout --signal=TERM --kill-after=15s 10m python src/gefs_full_members.py --workers 4 --force

      - name: Finalize availability contract
        run: python src/availability_contract.py --input work/model_snapshot.json

      - name: Audit complete liveproof bundle
        run: |
          python src/audit_integrity.py --kind models --input work/model_snapshot.json --json-out work/model_integrity.json --md-out work/model_integrity.md
          cat work/model_integrity.md >> "$GITHUB_STEP_SUMMARY"

      - name: Assert GEFS full-member acceptance gates
        run: python src/phase2f3_liveproof_helper.py gate

      - name: Transfer accepted liveproof bundle to private repository
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          PRIVATE_REPO: janwohlers78/mardorf-kitevorhersage
        run: |
          python src/push_private.py --kind models --file work/model_snapshot.json --integrity-json work/model_integrity.json --integrity-md work/model_integrity.md

      - name: Fail if integrity audit is not green
        run: |
          python -c "import json; d=json.load(open('work/model_integrity.json')); raise SystemExit(1 if d['error_count'] else 0)"
