name: Phase 2G-1 provider cycle acceptance

on:
  push:
    branches: [main]
    paths:
      - 'src/_phase2g1_provider_cycle_acceptance.py'
      - '.github/workflows/phase2g1-provider-cycle-readback.yml'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install ecCodes
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-tools
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-runtime.txt
      - name: Verify provider cycle gate
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          PRIVATE_REPO: janwohlers78/mardorf-kitevorhersage
        run: python src/_phase2g1_provider_cycle_acceptance.py
