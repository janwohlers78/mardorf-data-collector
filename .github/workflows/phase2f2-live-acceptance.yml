name: Phase 2F-2 ECMWF live acceptance

on:
  push:
    branches:
      - phase2f2-live-acceptance
    paths:
      - '.github/workflows/phase2f2-live-acceptance.yml'

permissions:
  contents: read

concurrency:
  group: phase2f2-ecmwf-live-acceptance
  cancel-in-progress: true

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COLLECTOR_MODEL_FILE: work/model_snapshot.json
      FULL_VALIDATION: 'true'
      PRIVATE_REPO: janwohlers78/mardorf-kitevorhersage
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install ecCodes
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-tools
          grib_ls -V
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-runtime.txt
      - name: Seed latest verified bundle and force only ECMWF
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          import provider_cycle_gate as gate

          repo=os.environ['PRIVATE_REPO']
          token=os.environ['PRIVATE_REPO_TOKEN']
          latest,seed,seed_path,seed_sha=gate.load_seed(repo,token)
          selected=gate.discover('ECMWF-IFS',full_validation=True)
          checked=datetime.now(timezone.utc).isoformat()
          models={}
          for model in gate.MODELS:
              rows=(seed.get('models') or {}).get(model) or []
              if model=='ECMWF-IFS':
                  models[model]={
                      'action':'fetch',
                      'reason':'phase2f2_targeted_live_acceptance',
                      'selected_run_time_utc':selected.isoformat(),
                  }
              else:
                  if not rows:
                      raise RuntimeError(f'cannot carry {model}: seed has no parent rows')
                  runs={r.get('run_time_utc') for r in rows}
                  if len(runs)!=1:
                      raise RuntimeError(f'cannot carry {model}: seed has mixed runs {runs}')
                  models[model]={
                      'action':'carry_forward',
                      'reason':'phase2f2_targeted_live_acceptance_no_provider_fetch',
                      'selected_run_time_utc':next(iter(runs)),
                  }
          plan={
              'schema_version':1,
              'method_version':gate.METHOD_VERSION,
              'checked_at_utc':checked,
              'private_repo':repo,
              'full_validation':True,
              'seed_payload_path':seed_path,
              'seed_payload_sha256':seed_sha,
              'seed_integrity_generated_at_utc':latest.get('generated_at_utc'),
              'models':models,
              'any_work':True,
              'delta_prediction':'nonzero',
              'no_op_transfer_suppressed':False,
              'phase2f2_targeted_acceptance':True,
          }
          gate.prepare_seed(seed,plan,os.environ['COLLECTOR_MODEL_FILE'])
          open('work/provider_cycle_plan.json','w').write(json.dumps(plan,indent=2,sort_keys=True)+'\n')
          print(json.dumps(plan,indent=2,sort_keys=True))
          PY
      - name: Fetch ECMWF base horizon
        shell: bash
        run: |
          last=1
          for source in azure google ecmwf; do
            echo "ECMWF base attempt via $source"
            set +e
            ECMWF_OPEN_DATA_SOURCE="$source" timeout --signal=TERM --kill-after=15s 8m python src/provider_fetch.py --model ECMWF-IFS --stage base
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then last=0; break; fi
            last=$rc
          done
          exit "$last"
      - name: Fetch ECMWF compatibility extension
        shell: bash
        run: |
          last=1
          for source in azure google ecmwf; do
            echo "ECMWF extension attempt via $source"
            set +e
            ECMWF_OPEN_DATA_SOURCE="$source" timeout --signal=TERM --kill-after=15s 8m python src/provider_fetch.py --model ECMWF-IFS --stage extension
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then last=0; break; fi
            last=$rc
          done
          exit "$last"
      - name: Fetch remaining ECMWF native horizon only
        env:
          ECMWF_OPEN_DATA_SOURCE: azure
        run: timeout --signal=TERM --kill-after=15s 15m python src/collect_full_horizon.py
      - name: Finalize availability contract
        run: python src/availability_contract.py --input work/model_snapshot.json
      - name: Verify Phase 2F-2 Registry coverage in live bundle
        run: |
          python - <<'PY'
          import json
          p=json.load(open('work/model_snapshot.json'))
          expected={
              '10u':'wind_u_10m','10v':'wind_v_10m','2t':'air_temperature_2m',
              '2d':'dewpoint_temperature_2m','sp':'surface_pressure','msl':'mean_sea_level_pressure',
              'tcc':'total_cloud_cover','ssrd':'surface_downward_shortwave',
              'tp':'total_precipitation','mucape':'cape'
          }
          rows=list((p.get('models') or {}).get('ECMWF-IFS') or [])
          rows+=list((((p.get('full_horizon_archive') or {}).get('sources') or {}).get('ECMWF-IFS') or {}).get('records') or [])
          if not rows: raise SystemExit('no ECMWF rows')
          received={k:0 for k in expected}; unsupported={'relative_humidity_2m':0,'cin':0}
          bad=[]
          for row in rows:
              vals=row.get('values') or {}
              for native,semantic in expected.items():
                  for item in vals.get(native) or []:
                      if item.get('semantic_id')!=semantic:
                          bad.append((native,item.get('semantic_id'),semantic))
                      if item.get('availability_status')=='received':
                          received[native]+=1
              for item in row.get('field_availability_states') or []:
                  sid=item.get('semantic_id')
                  if sid in unsupported and item.get('availability_status')=='unsupported_by_provider_or_product':
                      unsupported[sid]+=1
          missing=[k for k,v in received.items() if not v]
          if missing or bad or any(v==0 for v in unsupported.values()):
              raise SystemExit(f'2F2 live registry gate failed missing={missing} bad={bad[:5]} unsupported={unsupported}')
          summary=p.get('ecmwf_registry_v1_acquisition') or {}
          if summary.get('registry_version')!='relevant-meteorology-v1':
              raise SystemExit(f'wrong registry summary {summary}')
          print(json.dumps({'ecmwf_rows':len(rows),'received_counts':received,'unsupported_counts':unsupported,'summary':summary},indent=2,sort_keys=True))
          PY
      - name: Audit every model source
        run: |
          python src/audit_integrity.py --kind models --input work/model_snapshot.json --json-out work/model_integrity.json --md-out work/model_integrity.md
          cat work/model_integrity.md >> "$GITHUB_STEP_SUMMARY"
      - name: Transfer accepted bundle to private repository
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          args=(--kind models --integrity-json work/model_integrity.json --integrity-md work/model_integrity.md --file work/model_snapshot.json)
          python src/push_private.py "${args[@]}"
      - name: Fail on integrity errors
        run: |
          python - <<'PY'
          import json
          d=json.load(open('work/model_integrity.json'))
          print('integrity_status=',d['status'],'errors=',d['error_count'],'warnings=',d['warning_count'])
          if d['error_count']:
              raise SystemExit(1)
          PY
