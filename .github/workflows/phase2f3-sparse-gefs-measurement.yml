name: Phase 2F-3 sparse GEFS measurement

on:
  push:
    branches: [phase2f3-sparse-full-gefs]
    paths:
      - 'src/gefs_full_members.py'
      - 'src/measure_gefs_sparse_policy.py'
      - '.github/workflows/phase2f3-sparse-gefs-measurement.yml'

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install ecCodes
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-tools
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests==2.32.5
      - name: Measure exact sparse policy
        env:
          PYTHONPATH: src
        run: python src/measure_gefs_sparse_policy.py --run 2026-09-26T00:00:00+00:00
