name: Collect frozen WP06 API source
on:
  schedule:
    - cron: '35 5,6 * * *'
  workflow_dispatch:
    inputs:
      watchdog:
        description: 'Bounded current-source refresh or morning recovery'
        type: boolean
        default: false
      li_probe:
        description: 'Manual native EUMETSAT LI access test; skips ordinary weather capture'
        type: boolean
        default: false
      li_start_utc:
        description: 'Explicit past UTC start, only with li_probe (maximum one hour)'
        type: string
      li_end_utc:
        description: 'Explicit past UTC end, only with li_probe'
        type: string
permissions:
  contents: read
concurrency:
  group: wp06-single-run-daily
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Select 07:35 Europe Berlin slot
        id: slot
        run: |
          value=$(python -c "from datetime import datetime;from zoneinfo import ZoneInfo;print('true' if datetime.now(ZoneInfo('Europe/Berlin')).hour==7 else 'false')")
          echo "due=$value" >> "$GITHUB_OUTPUT"
      - name: Recheck daily report recovery eligibility
        if: github.event_name == 'workflow_dispatch' && inputs.watchdog == true && inputs.li_probe != true
        id: recovery
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          if [ "${{ steps.slot.outputs.due }}" = "true" ]; then
            PYTHONPATH=src python -m mardorf_collector.runtime.check_collection_due --kind daily_weather --max-age-minutes 0
          else
            PYTHONPATH=src python -m mardorf_collector.runtime.check_collection_due --kind current_weather --max-age-minutes 180
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: (github.event_name == 'workflow_dispatch' && inputs.li_probe == true) || ((github.event_name == 'workflow_dispatch' && inputs.watchdog != true) || (github.event_name == 'schedule' && steps.slot.outputs.due == 'true') || steps.recovery.outputs.due == 'true')
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-cloud.txt
      - name: Install pinned transport
        if: (github.event_name == 'workflow_dispatch' && inputs.li_probe == true) || ((github.event_name == 'workflow_dispatch' && inputs.watchdog != true) || (github.event_name == 'schedule' && steps.slot.outputs.due == 'true') || steps.recovery.outputs.due == 'true')
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-runtime.txt -r requirements-cloud.txt
      - name: Capture original and publish verified receipt
        if: inputs.li_probe != true && ((github.event_name == 'workflow_dispatch' && inputs.watchdog != true) || (github.event_name == 'schedule' && steps.slot.outputs.due == 'true') || steps.recovery.outputs.due == 'true')
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          args=()
          if [ "${{ steps.slot.outputs.due }}" = "true" ]; then args+=(--registered-daily-00 --with-wp08-labels); fi
          PYTHONPATH=src python -m mardorf_collector.runtime.wp06_single_run_v1 --with-wp07 --with-wp09-events "${args[@]}"
      - name: Test native EUMETSAT LI access and publish private originals
        if: github.event_name == 'workflow_dispatch' && inputs.li_probe == true
        env:
          EUMETSAT_CONSUMER_KEY: ${{ secrets.EUMETSAT_CONSUMER_KEY }}
          EUMETSAT_CONSUMER_SECRET: ${{ secrets.EUMETSAT_CONSUMER_SECRET }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          LI_START_UTC: ${{ inputs.li_start_utc }}
          LI_END_UTC: ${{ inputs.li_end_utc }}
        run: PYTHONPATH=src python -m mardorf_collector.runtime.wp09_eumetsat_probe_v1
