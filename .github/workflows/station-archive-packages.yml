name: Prepare bounded ten-year station packages
on:
  workflow_dispatch:
    inputs:
      stations:
        description: All four registered stations or one registered CDC ID
        type: choice
        options: [all, '04745', '00963', '00662', '01691']
        default: all
      years:
        description: All years 2016–2025 or one archive year
        type: choice
        options: [all, '2016', '2017', '2018', '2019', '2020', '2021', '2022', '2023', '2024', '2025']
        default: all
permissions:
  contents: read
concurrency:
  group: public-station-package-expansion-v1
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: plan
        env:
          ARCHIVE_STATIONS: ${{ inputs.stations }}
          ARCHIVE_YEARS: ${{ inputs.years }}
        run: |
          python - <<'PYCODE'
          import json,os,pathlib
          registered=json.loads(pathlib.Path('config/dev03_wp15_regional_stations_v1.json').read_text())
          contract=json.loads(pathlib.Path('config/dev03_wp15_archive_package_contract_v1.json').read_text())
          stations=[s['id'] for s in registered['stations']] if os.environ['ARCHIVE_STATIONS']=='all' else [os.environ['ARCHIVE_STATIONS']]
          years=contract['archive_years'] if os.environ['ARCHIVE_YEARS']=='all' else [int(os.environ['ARCHIVE_YEARS'])]
          assert set(stations)<={s['id'] for s in registered['stations']} and set(years)<=set(contract['archive_years'])
          matrix=[dict(station=s,year=y) for s in stations for y in years]
          assert 0<len(matrix)<=contract['max_packages']
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('matrix='+json.dumps({'include':matrix},separators=(',',':'))+'\n')
          PYCODE
  build:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned station dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-runtime.txt -r requirements-cloud.txt -r requirements-wp15-models.txt -r requirements-wp15-stations.txt
      - name: Prepare all ten products and twelve months for one station/year
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_ENDPOINT_URL: ${{ vars.B2_ENDPOINT_URL }}
          B2_REGION: ${{ vars.B2_REGION }}
          B2_BUCKET: ${{ vars.B2_BUCKET }}
          PACKAGE_STATION: ${{ matrix.station }}
          PACKAGE_YEAR: ${{ matrix.year }}
        run: PYTHONPATH=src python -u -m mardorf_collector.wp15.packages_v1 build --station "$PACKAGE_STATION" --year "$PACKAGE_YEAR" --workers 2
      - name: Retain aggregate package evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: station-package-${{ matrix.station }}-${{ matrix.year }}-${{ github.run_attempt }}
          path: work/wp15_archive_packages.json
          retention-days: 14
          if-no-files-found: warn
  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned station dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-runtime.txt -r requirements-cloud.txt -r requirements-wp15-models.txt -r requirements-wp15-stations.txt
      - name: Seal complete immutable archive release
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_ENDPOINT_URL: ${{ vars.B2_ENDPOINT_URL }}
          B2_REGION: ${{ vars.B2_REGION }}
          B2_BUCKET: ${{ vars.B2_BUCKET }}
          PACKAGE_STATIONS: ${{ inputs.stations }}
          PACKAGE_YEARS: ${{ inputs.years }}
        run: PYTHONPATH=src python -u -m mardorf_collector.wp15.packages_v1 release --stations "$PACKAGE_STATIONS" --years "$PACKAGE_YEARS"
      - name: Retain aggregate release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: station-package-release-${{ github.run_attempt }}
          path: work/wp15_archive_packages.json
          retention-days: 14
          if-no-files-found: error
