name: Retrieve registered ten-year GFS archive program
on:
  workflow_dispatch:
    inputs:
      first_batch:
        description: First uncaptured registered batch; prior completed batches must be excluded
        type: string
        required: true
        default: '3'
permissions:
  contents: read
concurrency:
  group: historical-weather-research-v1
  cancel-in-progress: false
jobs:
  plan:
    if: github.repository == 'janwohlers78/mardorf-data-collector'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_remaining: ${{ steps.plan.outputs.has_remaining }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-runtime.txt -r requirements-cloud.txt
      - id: plan
        env:
          GFS_FIRST_BATCH: ${{ inputs.first_batch }}
        run: PYTHONPATH=src python -m mardorf_collector.providers.gfs_archive_program_v1 plan
  priority:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-runtime.txt -r requirements-cloud.txt
      - name: Retrieve priority batches serially
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_ENDPOINT_URL: ${{ vars.B2_ENDPOINT_URL }}
          B2_REGION: ${{ vars.B2_REGION }}
          B2_BUCKET: ${{ vars.B2_BUCKET }}
          GFS_FIRST_BATCH: ${{ inputs.first_batch }}
        run: PYTHONPATH=src python -m mardorf_collector.providers.gfs_archive_program_v1 priority
      - name: Preserve object references without weather bytes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gfs-priority-references
          path: work/gfs-program/**/result-reference.json
          if-no-files-found: error
          retention-days: 14
  acquire:
    needs: [plan, priority]
    if: needs.plan.outputs.has_remaining == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-runtime.txt -r requirements-cloud.txt
      - name: Retrieve bounded archive batch
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_ENDPOINT_URL: ${{ vars.B2_ENDPOINT_URL }}
          B2_REGION: ${{ vars.B2_REGION }}
          B2_BUCKET: ${{ vars.B2_BUCKET }}
          GFS_FIRST_BATCH: ${{ inputs.first_batch }}
          GFS_BATCH: ${{ matrix.batch }}
        run: PYTHONPATH=src python -m mardorf_collector.providers.gfs_archive_program_v1 batch
      - name: Preserve object references without weather bytes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gfs-batch-${{ matrix.batch }}-reference
          path: work/gfs-program/**/result-reference.json
          if-no-files-found: error
          retention-days: 14
