        type: boolean
        default: false
      cloud_canary:
        description: 'Manual isolated B2 delivery proof; no productive private branch changes'
        type: boolean
        default: false
      watchdog:
        description: 'Routine external watchdog trigger; respects freshness gate'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
