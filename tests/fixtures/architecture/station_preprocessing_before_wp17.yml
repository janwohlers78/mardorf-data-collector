name: Prepare station archives and projections

on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [verify, backfill, archive-capture]
        default: verify
      stations:
        description: Registered CDC station IDs separated by commas
        type: string
        default: '04745'
      products:
        description: Registered hourly products separated by commas
        type: string
        default: wind
      year:
        type: number
        default: 2016
      lane:
        type: choice
        options: [a, b]
        default: a
      max_units:
        type: number
        default: 1
  workflow_call:
    inputs:
      operation:
        type: string
        default: verify
      stations:
        type: string
        default: '04745'
      products:
        type: string
        default: wind
      year:
        type: number
        default: 2016
      lane:
        type: string
        default: a
      max_units:
        type: number
        default: 1
    secrets:
      PRIVATE_REPO_TOKEN:
        required: true
      B2_APPLICATION_KEY_ID:
        required: true
      B2_APPLICATION_KEY:
        required: true

permissions:
  contents: read

# Persistent B2 month checkpoints are authoritative. GitHub concurrency is a
# guard, not a durable queue; retrying an interrupted request resumes checkpoints.
concurrency:
  group: public-station-archive-${{ inputs.lane == 'b' && 'b' || 'a' }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'janwohlers78/mardorf-data-collector'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned public processing dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-runtime.txt -r requirements-cloud.txt -r requirements-wp15-models.txt -r requirements-wp15-stations.txt
      - name: Prepare bounded registered station request
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_ENDPOINT_URL: ${{ vars.B2_ENDPOINT_URL }}
          B2_REGION: ${{ vars.B2_REGION }}
          B2_BUCKET: ${{ vars.B2_BUCKET }}
          STATION_OPERATION: ${{ inputs.operation }}
          STATION_IDS: ${{ inputs.stations }}
          STATION_PRODUCTS: ${{ inputs.products }}
          STATION_YEAR: ${{ inputs.year }}
          STATION_MAX_UNITS: ${{ inputs.max_units }}
        run: |
          PYTHONPATH=src python -m mardorf_collector.wp15.jobs "$STATION_OPERATION" --stations "$STATION_IDS" --products "$STATION_PRODUCTS" --year "$STATION_YEAR" --max-units "$STATION_MAX_UNITS"
      - name: Publish aggregate nonblocking telemetry
        if: always()
        run: |
          python - <<'PY'
          import json,os,pathlib
          path=pathlib.Path('work/wp15_station_preprocessing.json')
          if path.exists():
              report=json.loads(path.read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
                  out.write('Station preprocessing: '+report['status']+'\n\n')
                  out.write('Routine telemetry (nonblocking): '+json.dumps(report.get('metrics',{}))+'\n')
          PY
